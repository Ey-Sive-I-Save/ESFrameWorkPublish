  discoveryPolicy: .agents/SKILL_DISCOVERY_POLICY.json
  registryManifest: .agents/SKILL_REGISTRY.manifest.json
  specializedAcceptanceRegistry: .agents/skills/es-static-deep-replay/references/specialized-acceptance-registry.json
  required: [SKILL.md, agents/openai.yaml, governance.json, evidence-contract.binding.json, scripts/Test-ESSkillEvidence.ps1, static-replay.manifest.json, references/static-replay-adapter.md]
  optional: [references/, scripts/, mcp/, assets/]
  evidence: [positive, invalid-input, denied-expansion, repeat-idempotency, interruption-recovery]
rules:
  - id: skill.verification.static-runtime-separation
    statement: Static source/configuration proof and Runtime external-execution proof are independent axes. runtime-not-run is evidence absence, not static failure; the selected verification profile determines whether it blocks.
  - id: skill.verification.static-deep-replay-first
    statement: StaticDeepReplay is the default fast path and carries at least half of verification weight. Runtime requires a current user instruction that explicitly names the action, budget, timeout and stop condition; AIBrain plan and matching AICommand/TaskContract are additional protocol inputs only when the AIBrain channel is selected.
  - id: skill.verification.static-replay-adapter
    statement: Every direct Skill must expose a project-local static-replay.manifest.json, an adapter reference, and a named *-StaticReplay.ps1 runner that delegates to es-static-deep-replay.
  - id: skill.verification.responsibility-specialization
    statement: The common seven StaticDeepReplay cases are a minimum floor. At least twenty high-impact Skills must additionally declare specializedAcceptance with responsibility-specific cases, evidence artifacts, source assertions, and an explicit Runtime boundary; the registry and Validator enforce identity and completeness.
  - id: skill.resource.no-copy
    statement: Rules remain in AIWarnings; contracts remain in AICommands; Skills link to live authority instead of copying it.
  - id: skill.resource.mcp-gated
    statement: MCP is an evidence/host capability, never implicit permission for AI-inferred work. Current explicit user instructions remain the action authority; AIBrain discovery is required only when that managed channel is selected.
  - id: skill.resource.reference-depth
    statement: SKILL.md may link one level deep to stable references; references must declare authority, scope, staleWhen and evidence.
  - id: skill.resource.script-contract
    statement: Every script declares parameters, read/write scope, exit codes, idempotency, failure and recovery.
  - id: skill.catalog.registration
    statement: Every direct Skill root with SKILL.md must have exactly one current record in SKILL_CATALOG.yaml before acceptance; catalog metadata is navigation and lifecycle state, not permission.
  - id: skill.discovery.lifecycle-separation
    statement: Skill existence, discoveryState, planEligibility and runtimeEligibility are independent; Proposed or unverified Skills may be indexed as candidates but cannot be presented as accepted execution capability.
  - id: skill.discovery.route-scope
    statement: Operational discovery requires a task route scope; an empty route scope must request re-planning and may not trigger whole-portfolio Skill正文读取.
  - id: skill.discovery.registry-manifest
    statement: Skill Catalog, Resource Index, AIBRAIN route entry, AICommand Catalog and discovery policy are bound by the generated Skill Registry Manifest; KnowledgeIndex is validated by its own SourceRef/ContentHash contract and by the dependency-closure check. Any generation or metadata hash mismatch is stale and requires rebuild before acceptance.
  - id: skill.portfolio.gate
    statement: Before project-level acceptance or release, Test-ESSkillPortfolio.ps1 must run across every direct Skill; any contract, required-resource, hash or security block keeps the portfolio blocked.
  - id: skill.execution.performance-path
    statement: Every Skill defaults to Fast Path. Full scans, uncached whole-repository hashing, complete Graph Bake, Unity validation, external network calls, bulk evidence copying/hashing and unbounded FanOut require an explicit Deep Path plan with budget, timeout, concurrency and evidence scope.
  - id: skill.execution.cache-safety
    statement: Caches may reduce discovery and unchanged-file work, but never replace current authorization, stable-identity, PlanHash or required evidence checks; stale or invalid cache state forces re-plan or a declared blocked/not-run result.
  - id: skill.project.semantic-binding
    statement: Every direct Skill must be discoverable through AIBRAIN_ENTRY, appear in at least one KnowledgeIndex relatedSkills binding with an overlapping routeKey, exist in SKILL_RESOURCE_INDEX and have matching Catalog skillHash/governanceHash; missing bindings block acceptance.
