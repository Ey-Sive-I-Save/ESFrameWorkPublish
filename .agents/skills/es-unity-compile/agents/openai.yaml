interface:
  display_name: "ES Unity 编译验收"
  short_description: "检查 Unity CLI、编译、Console、程序集与证据等级"
  default_prompt: "Use $es-unity-compile to verify Unity compilation or run guarded Unity CLI compile/test workflows."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "unityMCP"
      description: "Connect to and inspect the active Unity Editor project."
      transport: "streamable_http"
      url: "http://127.0.0.1:8080/mcp"
