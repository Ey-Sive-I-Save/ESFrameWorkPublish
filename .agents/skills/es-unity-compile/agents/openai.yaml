interface:
  display_name: "ES Unity 编译验收"
  short_description: "检查 Unity 编译证据分层、构建身份回执与产物新鲜度"
  default_prompt: "Use $es-unity-compile to verify Unity evidence or capture, finalize, and validate a build identity receipt without promoting static provenance into runtime acceptance."

policy:
  allow_implicit_invocation: true

dependencies:
  tools:
    - type: "mcp"
      value: "unityMCP"
      description: "Connect to and inspect the active Unity Editor project."
      transport: "streamable_http"
      url: "http://127.0.0.1:8080/mcp"
