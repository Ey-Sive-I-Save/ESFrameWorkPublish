dimensions:
  - id: typography-layout
    routeKeys: [web-layout-system, web-typography, web-type-scale, web-editorial-grid]
    knowledgeIds: [es.project.web-typography-layout.v1]
    capabilities: [semantic-order, fluid-type, container-query, editorial-grid, rtl-and-cjk-fallback]
    generation: define-content-intent -> choose-grid-and-type-scale -> emit-responsive-css -> preserve-dom-order
    validation: quality + accessibility + overflow-and-focus-static-checks
    publish: immutable-html-css-assets-with-manifest
  - id: motion-showcase
    routeKeys: [web-motion-showcase, web-scroll-animation, web-view-transition, web-3d-motion]
    knowledgeIds: [es.project.web-motion-showcase.v1]
    capabilities: [scroll-timeline, view-transition, finite-3d-depth, staggered-reveal, reduced-motion-fallback]
    generation: storyboard(hero,reveal,focus,micro) -> whitelist-transform-opacity -> emit-supports-fallback
    validation: reduced-motion + animation-budget + static-first-frame + unsupported-api-fallback
    publish: preserve-static-frame-and-feature-detect-enhancement
  - id: interaction
    routeKeys: [web-interaction, web-microinteraction, web-input-feedback, web-state-design]
    knowledgeIds: [es.project.web-interaction-experience.v1]
    capabilities: [state-machine, keyboard-parity, focus-management, async-recovery, idempotent-submit]
    generation: declare-intent-trigger-feedback-success-error-cancel-recovery -> bind-aria-and-focus
    validation: accessibility + contract + malformed-state-and-duplicate-submit-static-fixtures
    publish: deterministic-navigation-and-recoverable-runtime-boundary

pipeline:
  stages:
    - id: intent
      input: user-brief
      output: bounded-page-intent
    - id: knowledge-route
      input: [intent, routeKeys]
      output: selected-knowledge-1-to-3
    - id: page-ir
      input: [selected-knowledge, design-tokens, component-library]
      output: immutable-page-ir
    - id: generate
      input: page-ir
      output: static-html-css-js-and-manifest
    - id: validate
      input: generated-artifacts
      output: [quality-receipt, accessibility-receipt, contract-receipt, utf8-receipt]
    - id: publish
      input: accepted-static-receipts
      output: release-staging-artifact
  gate: every-stage-hash-and-evidence-bound; runtime-not-run remains explicit

failureSurface:
  - failureId: WEB-KG-001
    severity: identity/authority
    erroneousBehavior: 使用 mutable sourceAbsolutePath 替代私有快照或把外部案例当 ES 事实。
    triggerAndSymptom: 来源漂移、哈希不匹配、生成决策不可重放。
    rootCause: SourceRef/ContentHash 未绑定。
    preventionCheck: 校验所有本地 SourceRef 路径、SHA-256 与 staleWhen。
    correctAction: 标记 stale，回读权威源码并重建图谱。
    recoveryAction: 丢弃旧计划/回执，重新路由和哈希计算。
    evidencePresent: sourceRefs
    evidenceMissing: fresh-runtime-proof
  - failureId: WEB-KG-002
    severity: lifecycle/partial
    erroneousBehavior: 动效或交互增强失败后页面不可读、焦点丢失或无法恢复。
    triggerAndSymptom: reduced-motion/不支持 API/异步错误/重复提交。
    rootCause: 只生成视觉路径，没有静态首帧和状态机。
    preventionCheck: 要求静态首帧、@supports、完整状态和键盘焦点检查。
    correctAction: 保留内容与导航，降级动画并显示可恢复错误。
    recoveryAction: 使用 retry/cancel/undo 状态回到稳定态。
    evidencePresent: dimension validation fields
    evidenceMissing: browser DOM and timing receipt
  - failureId: WEB-KG-003
    severity: advisory
    erroneousBehavior: 以静态 Quality/Accessibility 通过声称跨浏览器、性能或发布就绪。
    triggerAndSymptom: 缺少 Preview/Visual/Release 运行回执。
    rootCause: 混淆 Static 与 Runtime/Release 证据层。
    preventionCheck: 检查 nonClaims 与独立 receipt 状态。
    correctAction: 仅声明静态范围，标注 runtime-not-run。
    recoveryAction: 在获得明确授权后执行对应运行验证并绑定新回执。
    evidencePresent: evidenceLevel S1 and nonClaims
    evidenceMissing: runtime-not-run receipts
