esCanonicalProjection:
  rendering: route-level renderPolicy maps to prerender|cached|dynamic|client-only; never imports framework runtime semantics.
  visual: Page IR uses responsiveBasis=container plus media preferences (forced-colors, prefers-reduced-motion); tokens remain source of truth.
  interaction: model explicit state/event transitions and hydration/client boundaries; generated JS remains progressive-enhancement-safe.
  assurance: keep WCAG normative, automated checks, assistive-tech, browser, visual-regression and web-vitals evidence separate.
  delivery: require basePath/static analyzability, immutable asset hashes, adapter contract and cache invalidation evidence.
  licensing: no source-code vendoring; provenance and license review required before adopting implementation.

comparisonRules:
  - staticEvidenceCannotPromoteRuntime
  - frameworkVersionMustBePinnedBeforeMigration
  - capabilityLabelsAreDesignSignalsNotCompatibilityClaims
  - routePolicyAndAdapterBoundaryRequiredForDynamicFeatures
